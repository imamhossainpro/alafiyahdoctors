# nixpacks.toml
# Railway কে বলছি: Frontend build skip করো, শুধু backend server চালাও

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --omit=dev || npm install"]

[phases.build]
cmds = ["echo '⏭️ Skipping frontend build for backend server'"]

[start]
cmd = "node server.js"